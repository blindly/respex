name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go fmt ./...
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go build -ldflags "-X github.com/blindly/respex/internal/cli.version=${GITHUB_REF_NAME}" -o "${RUNNER_TEMP}/respex-version-check" .
      - run: test "$("${RUNNER_TEMP}/respex-version-check" --version)" = "respex ${GITHUB_REF_NAME}"
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
